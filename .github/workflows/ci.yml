name: AlgoLens Production CI/CD Pipeline

on:
  push:
    branches: [ main, architecture/event-runtime-migration ]
  pull_request:
    branches: [ main, architecture/event-runtime-migration ]

jobs:
  test-and-build:
    name: Regression Suite, Typecheck, and Docker Verification
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'backend/requirements.txt'

      - name: 3. Install LLVM / Clang++ and Native Toolchains
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang \
            lld \
            libclang-dev \
            build-essential \
            curl
          clang++ --version
          clang --version

      - name: 4. Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: 5. Install Backend Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install httpx pytest

      - name: 6. Install Frontend Node Dependencies
        working-directory: frontend
        run: |
          npm ci

      - name: 7. Frontend TypeScript Typecheck
        working-directory: frontend
        run: |
          npx tsc --noEmit

      - name: 8. Frontend Next.js Production Build
        working-directory: frontend
        run: |
          npm run build

      - name: 9. Run M0-M9 Full Regression Test Suites
        working-directory: backend
        run: |
          echo "=== Milestone 1 Pipeline ==="
          python run_milestone_1_pipeline.py
          echo "=== Milestone 2 Reversible Deltas & Playback ==="
          python run_milestone_2_tests.py
          echo "=== Milestone 4 Native C++ Golden Tests ==="
          python run_milestone_4_tests.py
          echo "=== Milestone 5 Advanced Objects & References ==="
          python run_milestone_5_tests.py
          echo "=== Milestone 6 Compilation Cache & Invalidation ==="
          python run_milestone_6_tests.py
          echo "=== Milestone 7 Universal Contract & Python Producer ==="
          python run_milestone_7_tests.py
          echo "=== Milestone 8 Frontend Integration & E2E ==="
          python run_milestone_8_tests.py
          echo "=== Milestone 9 Subsystem Unification & Sandbox ==="
          python run_milestone_9_tests.py
          echo "=== Milestone 10 Production Hardening & Telemetry ==="
          python run_milestone_10_tests.py

      - name: 10. Build Production Docker Image
        run: |
          docker build -t algolens-backend:latest --target backend .

      - name: 11. Run Backend Container Stack
        run: |
          docker run -d \
            --name algolens-backend-test \
            -p 8000:8000 \
            --security-opt no-new-privileges:true \
            --tmpfs /tmp:exec,mode=1777 \
            algolens-backend:latest
          
          # Wait for container startup
          sleep 5

      - name: 12. Container Healthcheck & API Probing
        run: |
          # 1. Healthcheck probe
          curl --fail --retry 5 --retry-delay 2 http://localhost:8000/api/version

          # 2. Python E2E Probe inside Container
          python -c "
          import urllib.request, json
          req = urllib.request.Request(
              'http://localhost:8000/api/execute',
              data=json.dumps({'code': 'x = 10\ny = 20\nz = x + y', 'language': 'python'}).encode('utf-8'),
              headers={'Content-Type': 'application/json'}
          )
          res = urllib.request.urlopen(req, timeout=10)
          data = json.loads(res.read().decode('utf-8'))
          assert data.get('events') is not None, 'Missing events in response'
          assert len(data['events']) > 0, 'Empty events in response'
          assert data.get('request_id') is not None, 'Missing request_id'
          print('Container Python Execution Verified! Events:', len(data['events']), 'Req ID:', data['request_id'])
          "

          # 3. C++ Native Compilation & Execution Probe inside Container
          python -c "
          import urllib.request, json
          req = urllib.request.Request(
              'http://localhost:8000/api/execute',
              data=json.dumps({'code': 'int main() { int a = 42; return a; }', 'language': 'cpp'}).encode('utf-8'),
              headers={'Content-Type': 'application/json'}
          )
          res = urllib.request.urlopen(req, timeout=15)
          data = json.loads(res.read().decode('utf-8'))
          assert data.get('events') is not None, 'Missing events in C++ response'
          assert len(data['events']) > 0, 'Empty events in C++ response'
          assert data.get('request_id') is not None, 'Missing request_id in C++ response'
          print('Container C++ Native Execution Verified! Events:', len(data['events']), 'Req ID:', data['request_id'])
          "

      - name: 13. Container Teardown
        if: always()
        run: |
          docker logs algolens-backend-test || true
          docker stop algolens-backend-test || true
          docker rm algolens-backend-test || true
